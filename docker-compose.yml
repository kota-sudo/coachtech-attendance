services:
  php:
    build: ./docker/php
    container_name: attendance_php
    volumes:
      - ./src:/var/www
    working_dir: /var/www
    networks:
      - attendance
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: attendance_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - attendance
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: attendance_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: attendance_db
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - attendance
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: attendance_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: attendance_user
      PMA_PASSWORD: password
    networks:
      - attendance
    depends_on:
      mysql:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: attendance_mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - attendance

networks:
  attendance:
    driver: bridge

volumes:
  mysql_data: